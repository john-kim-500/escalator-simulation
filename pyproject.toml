# Settings for Ruff, the Python style checker. This is not a package build file:
# the simulation has no install step. See "Coding standards" in CLAUDE.md.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = [
    "E", "W",  # basic layout, including the 100-character limit
    "F",       # mistakes such as unused imports and undefined names
    "I",       # import order
    "UP",      # outdated Python forms
    "ANN",     # missing type hints
    "Q",       # double quotes
]
ignore = [
    "ANN401",  # allow `Any` where data really is free-form JSON
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # type hints are not required in tests
